<!doctype html>
<html lang="fr"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>EduFirst — Dashboard Parent</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200..800&display=swap" rel="stylesheet" /><script src="https://cdn.tailwindcss.com"></script><script type="module" src="/assets/js/tailwind-config.js"></script><link rel="stylesheet" href="/assets/css/theme.css" /></head>
<body class="bg-bg"><div data-page-content>
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6" id="kpis"></div>
  <div class="grid lg:grid-cols-2 gap-6">
    <div class="edu-card p-6"><h2 class="font-semibold mb-4">Mes enfants</h2><div id="kids" class="space-y-3"></div></div>
    <div class="edu-card p-6"><h2 class="font-semibold mb-4">Dernières notes</h2><div id="grades" class="space-y-3"></div></div>
  </div>
</div>
<script type="module" src="/assets/js/ui.js"></script><script type="module" src="/assets/js/api.js"></script><script type="module" src="/assets/js/layout.js"></script>
<script>
renderLayout({ role: "parent", title: "Bonjour, M. Diallo", subtitle: "Suivi de vos enfants en temps réel" });
document.getElementById("kpis").innerHTML = [{l:"Enfants",v:"2",i:"users"},{l:"Moyenne",v:"15.2/20",i:"chart"},{l:"À payer",v:"250K FCFA",i:"alert"},{l:"Présence",v:"98%",i:"check"}].map(s=>`<div class="edu-card p-5"><div class="w-9 h-9 rounded-lg bg-primary-soft text-primary flex items-center justify-center mb-2">${icon(s.i,"w-4 h-4")}</div><div class="text-2xl font-bold">${s.v}</div><div class="text-xs text-muted mt-1">${s.l}</div></div>`).join("");
document.getElementById("kids").innerHTML = [{n:"Aïcha Diallo",c:"3ème A",m:15.4},{n:"Mamadou Diallo",c:"6ème B",m:14.8}].map(k=>`<a href="parent-children.html" class="flex justify-between items-center p-3 rounded-lg bg-bg hover:bg-primary-soft transition"><div><div class="font-medium text-sm">${k.n}</div><div class="text-xs text-muted">${k.c}</div></div><div class="font-bold text-primary">${k.m}/20</div></a>`).join("");
document.getElementById("grades").innerHTML = [{s:"Maths",n:16,e:"Aïcha"},{s:"Histoire",n:14,e:"Aïcha"},{s:"Français",n:15,e:"Mamadou"}].map(g=>`<div class="flex justify-between items-center p-3 rounded-lg bg-bg"><div><div class="font-medium text-sm">${g.s}</div><div class="text-xs text-muted">${g.e}</div></div><div class="font-bold text-primary">${g.n}/20</div></div>`).join("");
</script></body></html>
