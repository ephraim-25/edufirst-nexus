<!doctype html>
<html lang="fr"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>EduFirst — Profil</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200..800&display=swap" rel="stylesheet" /><script src="https://cdn.tailwindcss.com"></script><script src="/assets/js/tailwind-config.js"></script><link rel="stylesheet" href="/assets/css/theme.css" /></head>
<body class="bg-bg"><div data-page-content>
  <div class="edu-card p-8 max-w-2xl mx-auto">
    <div class="flex items-center gap-5 mb-6">
      <div class="w-20 h-20 rounded-full bg-gradient-to-br from-primary to-primary-glow text-white flex items-center justify-center text-2xl font-bold">A</div>
      <div><h2 class="text-xl font-bold">Admin EduFirst</h2><p class="text-muted text-sm">Lycée International Victor Hugo</p></div>
    </div>
    <form onsubmit="event.preventDefault();toast('Profil enregistré ✓')" class="space-y-4">
      <div class="grid sm:grid-cols-2 gap-4">
        <div><label class="block text-sm font-medium mb-1.5">Nom</label><input type="text" class="input" value="Admin" /></div>
        <div><label class="block text-sm font-medium mb-1.5">Prénom</label><input type="text" class="input" value="EduFirst" /></div>
      </div>
      <div><label class="block text-sm font-medium mb-1.5">Email</label><input type="email" class="input" value="admin@lycee-vh.edu" /></div>
      <div><label class="block text-sm font-medium mb-1.5">Téléphone</label><input type="tel" class="input" value="+225 07 00 00 00 00" /></div>
      <button class="btn btn-primary w-full">Enregistrer</button>
    </form>
  </div>
</div>
<script src="/assets/js/ui.js"></script><script src="/assets/js/api.js"></script><script src="/assets/js/layout.js"></script>
<script>renderLayout({ role: "admin", title: "Mon profil", subtitle: "Informations personnelles" });</script>
</body></html>
