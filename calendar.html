<!doctype html>
<html lang="fr"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>EduFirst — Calendrier</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200..800&display=swap" rel="stylesheet" /><script src="https://cdn.tailwindcss.com"></script><script type="module" src="/assets/js/tailwind-config.js"></script><link rel="stylesheet" href="/assets/css/theme.css" /></head>
<body class="bg-bg"><div data-page-content>
  <div class="grid lg:grid-cols-3 gap-6">
    <div class="edu-card p-6 lg:col-span-2">
      <div class="flex justify-between items-center mb-4"><h2 class="font-semibold">Mars 2025</h2><div class="flex gap-2"><button class="btn btn-outline px-3 py-1.5 text-sm">←</button><button class="btn btn-outline px-3 py-1.5 text-sm">→</button></div></div>
      <div class="grid grid-cols-7 gap-1 text-center text-xs text-muted mb-2">${''}<div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div></div>
      <div id="cal" class="grid grid-cols-7 gap-1"></div>
    </div>
    <div class="edu-card p-6">
      <h2 class="font-semibold mb-4">Événements à venir</h2>
      <div class="space-y-3" id="events"></div>
    </div>
  </div>
</div>
<script type="module" src="/assets/js/ui.js"></script><script type="module" src="/assets/js/api.js"></script><script type="module" src="/assets/js/layout.js"></script>
<script>
renderLayout({ role: "admin", title: "Calendrier", subtitle: "Événements, examens et réunions" });
const days = Array.from({length:31},(_,i)=>i+1);
const events = {15:"Réunion parents",20:"Examen Maths",25:"Conseil de classe"};
document.getElementById("cal").innerHTML = days.map(d=>`<div class="aspect-square p-2 rounded-lg ${events[d]?'bg-primary-soft':'bg-bg'} hover:bg-primary-soft transition cursor-pointer"><div class="text-sm font-medium">${d}</div>${events[d]?`<div class="text-[10px] text-primary mt-1 truncate">${events[d]}</div>`:''}</div>`).join("");
document.getElementById("events").innerHTML = Object.entries(events).map(([d,e])=>`<div class="flex gap-3 p-3 rounded-lg bg-bg"><div class="w-12 text-center"><div class="text-xs text-muted">MAR</div><div class="text-lg font-bold text-primary">${d}</div></div><div class="flex-1"><div class="font-medium text-sm">${e}</div><div class="text-xs text-muted">14:00 — Salle A</div></div></div>`).join("");
</script></body></html>
